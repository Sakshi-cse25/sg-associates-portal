<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Gallery | S.G. Associates</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/index.html">
        <span class="brand-mark" aria-hidden="true">SG</span>
        <span class="brand-text">
          <strong>S.G. Associates</strong>
          <span>All Types of Civil Works</span>
        </span>
      </a>
      <button id="navToggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="mainNav">
        Menu
      </button>
      <nav id="mainNav" class="main-nav" aria-label="Main navigation">
        <a href="/index.html">Home</a>
        <a href="/about.html">About</a>
        <a href="/services.html">Services</a>
        <a href="/projects.html">Projects</a>
        <a href="/gallery.html" aria-current="page">Gallery</a>
        <a href="/contact.html">Contact</a>
        <a href="/admin-login.html" class="nav-admin">Admin</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-banner">
      <div class="container">
        <h1>Site Work Gallery</h1>
        <p>Lazy-loaded visual documentation of civil engineering stages and finished structures.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="galleryStatus" role="status" aria-live="polite"></div>
        <div id="galleryGrid" class="card-grid"></div>
      </div>
    </section>
  </main>

  <div id="galleryModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modalTitle">Site Preview</h3>
        <button id="modalCloseBtn" class="btn btn-secondary btn-sm" type="button">Close</button>
      </div>
      <img id="modalImage" src="" alt="">
      <p id="modalProject" style="margin: 0.75rem 0 0; color: var(--color-muted);"></p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>&copy; <span id="footerYear"></span> S.G. Associates, Gurugram.</span>
        <a href="/contact.html">Discuss Your Project</a>
      </div>
    </div>
  </footer>

  <script src="/js/common.js" defer></script>
  <script src="/js/gallery.js" defer></script>
</body>
</html>
