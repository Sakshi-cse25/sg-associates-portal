<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | S.G. Associates</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/index.html">
        <span class="brand-mark" aria-hidden="true">SG</span>
        <span class="brand-text">
          <strong>S.G. Associates</strong>
          <span>Staff Administration Portal</span>
        </span>
      </a>
      <button id="navToggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="mainNav">
        Menu
      </button>
      <nav id="mainNav" class="main-nav" aria-label="Main navigation">
        <a href="/index.html">Home</a>
        <a href="/about.html">About</a>
        <a href="/services.html">Services</a>
        <a href="/projects.html">Projects</a>
        <a href="/gallery.html">Gallery</a>
        <a href="/contact.html">Contact</a>
        <a href="/admin-login.html" class="nav-admin" aria-current="page">Admin</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-banner">
      <div class="container">
        <h1>Administrator Login</h1>
        <p>Authorized staff access for managing services, projects, gallery items, and client enquiries.</p>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width: 30rem;">
        <article class="card">
          <h2>Sign In</h2>
          <div id="loginAlert" role="alert" aria-live="polite"></div>

          <form id="loginForm" novalidate>
            <div class="form-group">
              <label for="username">Username</label>
              <input class="form-control" type="text" id="username" name="username" required autocomplete="username">
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%;">Log In</button>
          </form>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>&copy; <span id="footerYear"></span> S.G. Associates. Protected Admin Area.</span>
        <a href="/index.html">Return to Public Site</a>
      </div>
    </div>
  </footer>

  <script src="/js/common.js" defer></script>
  <script src="/js/admin-login.js" defer></script>
</body>
</html>
